simulation:
  instanceName: more
  stopTime: 100000
  stepSize: 5.0

ships:
  - id: OS0
    
    spawn:
      start_time: 0.0
      north: 0.0
      east: 0.0
      yaw_angle_deg: 45.0
      forward_speed: 0.0

    route:
      north: [0.0, 10000.0 ]
      east:  [0.0, 10000.0 ]
      speed: [5.0]

    SHIP_BLOCKS:
      - [MISSION_MANAGER, FMUs/complex_ship/MissionManager.fmu]

      - [AUTOPILOT, FMUs/complex_ship/Autopilot.fmu]
      - [SHAFT_SPEED_CONTROLLER, FMUs/complex_ship/ShaftSpeedController.fmu]
      - [THROTTLE_CONTROLLER, FMUs/complex_ship/ThrottleController.fmu]
      - [COLAV, FMUs/complex_ship/CollisionAvoidanceCOLREGS.fmu]

      - [MACHINERY_SYSTEM, FMUs/complex_ship/MachinerySystemLTS.fmu]
      - [RUDDER, FMUs/complex_ship/Rudder.fmu]
      - [SHIP_MODEL, FMUs/complex_ship/ShipModel.fmu]
      
      - [GPS, FMUs/complex_ship/GPSSensor.fmu]
      - [GYROCOMPASS, FMUs/complex_ship/GyrocompassSensor.fmu]
      - [SPEED_LOG, FMUs/complex_ship/ShipSpeedLogSensor.fmu]
      - [RADAR, FMUs/complex_ship/DopplerRadar.fmu]
      - [CAMERA_FORE, FMUs/complex_ship/StereoCameraSensor.fmu]
      - [CAMERA_AFT, FMUs/complex_ship/StereoCameraSensor.fmu]
      - [CAMERA_PORT, FMUs/complex_ship/StereoCameraSensor.fmu]
      - [CAMERA_STARBOARD, FMUs/complex_ship/StereoCameraSensor.fmu]

      - [SHIP_EKF, FMUs/complex_ship/ShipEKF.fmu]
      - [TS_TRACKING_EKF_TS1, FMUs/complex_ship/TargetShipTrackingEKF.fmu]

      - [SURFACE_CURRENT, FMUs/env_loads/SurfaceCurrentModel.fmu]
      - [WIND, FMUs/env_loads/WindModel.fmu]

    SHIP_CONNECTIONS:
      # Mission manager
      - [MISSION_MANAGER, north, SHIP_EKF, estimated_n]
      - [MISSION_MANAGER, east,  SHIP_EKF, estimated_e]
   
      # Autopilot
      - [AUTOPILOT, north,                     SHIP_EKF,        estimated_n]
      - [AUTOPILOT, east,                      SHIP_EKF,        estimated_e]
      - [AUTOPILOT, yaw_angle_rad,             SHIP_EKF,        estimated_psi]
      - [AUTOPILOT, prev_wp_north,             MISSION_MANAGER, prev_wp_north]
      - [AUTOPILOT, prev_wp_east,              MISSION_MANAGER, prev_wp_east]
      - [AUTOPILOT, next_wp_north,             MISSION_MANAGER, next_wp_north]
      - [AUTOPILOT, next_wp_east,              MISSION_MANAGER, next_wp_east]
      - [AUTOPILOT, colav_heading_offset_deg,  COLAV,           colav_heading_offset_deg]

      # Shaft speed controller
      - [SHAFT_SPEED_CONTROLLER, desired_ship_speed,           MISSION_MANAGER,  next_wp_speed]
      - [SHAFT_SPEED_CONTROLLER, measured_ship_speed,          SHIP_EKF,         estimated_u]
      - [SHAFT_SPEED_CONTROLLER, colav_speed_reduction_factor, COLAV,         estimated_u]

      # Throttle controller
      - [THROTTLE_CONTROLLER, desired_shaft_speed_rpm,  SHAFT_SPEED_CONTROLLER, shaft_speed_cmd_rpm]
      - [THROTTLE_CONTROLLER, measured_shaft_speed_rpm, MACHINERY_SYSTEM,       shaft_speed_rpm]

      # Machinery
      - [MACHINERY_SYSTEM, load_perc, THROTTLE_CONTROLLER,  throttle_cmd]

      # Rudder
      - [RUDDER, rudder_angle_deg, AUTOPILOT  ,  rudder_angle_deg]
      - [RUDDER, yaw_angle_rad,    SHIP_MODEL ,  yaw_angle_rad]
      - [RUDDER, forward_speed,    SHIP_MODEL ,  forward_speed]

      # Ship model
      - [SHIP_MODEL, thrust_force,     MACHINERY_SYSTEM, thrust_force]
      - [SHIP_MODEL, rudder_force_v,   RUDDER,           rudder_force_v]
      - [SHIP_MODEL, rudder_force_r,   RUDDER,           rudder_force_r]
      - [SHIP_MODEL, current_speed ,   SURFACE_CURRENT,  current_speed]
      - [SHIP_MODEL, current_dir_rad , SURFACE_CURRENT,  current_direction_rad]
      - [SHIP_MODEL, wind_speed,       WIND,             wind_speed]
      - [SHIP_MODEL, wind_dir_rad ,    WIND,             wind_direction_rad]

      # Collision Avoidance (Only Internal Ports)
      - [COLAV, own_north,          SHIP_MODEL,           north]
      - [COLAV, own_east,           SHIP_MODEL,           east]
      - [COLAV, own_yaw_angle,      SHIP_MODEL,           yaw_angle_rad]
      - [COLAV, own_measured_speed, SHIP_MODEL,           total_ship_speed]
      - [COLAV, throttle_cmd,       THROTTLE_CONTROLLER,  throttle_cmd]
      - [COLAV, rudder_angle_deg,   AUTOPILOT,            rudder_angle_deg]

      # GPS
      - [GPS, north, SHIP_MODEL, north]
      - [GPS, east , SHIP_MODEL, east ]

      # Gyrocompass
      - [GYROCOMPASS, ship_heading_rad, SHIP_MODEL, yaw_angle_rad]

      # Speed log
      - [SPEED_LOG, ship_speed, SHIP_MODEL, total_ship_speed]

      # Doppler RADAR
      - [RADAR, own_north,          SHIP_MODEL, north]
      - [RADAR, own_east,           SHIP_MODEL, east]
      - [RADAR, own_yaw_angle,      SHIP_MODEL, yaw_angle_rad]
      - [RADAR, own_measured_speed, SHIP_MODEL, total_ship_speed]

      # Fore Stereo Camera
      - [CAMERA_FORE      , own_north,          SHIP_MODEL, north]
      - [CAMERA_FORE      , own_east,           SHIP_MODEL, east]
      - [CAMERA_FORE      , own_yaw_angle,      SHIP_MODEL, yaw_angle_rad]

      # Aft Stereo Camera
      - [CAMERA_AFT       , own_north,          SHIP_MODEL, north]
      - [CAMERA_AFT       , own_east,           SHIP_MODEL, east]
      - [CAMERA_AFT       , own_yaw_angle,      SHIP_MODEL, yaw_angle_rad]

      # Port Stereo Camera
      - [CAMERA_PORT      , own_north,          SHIP_MODEL, north]
      - [CAMERA_PORT      , own_east,           SHIP_MODEL, east]
      - [CAMERA_PORT      , own_yaw_angle,      SHIP_MODEL, yaw_angle_rad]

      # Starboard Stereo Camera
      - [CAMERA_STARBOARD , own_north,          SHIP_MODEL, north]
      - [CAMERA_STARBOARD , own_east,           SHIP_MODEL, east]
      - [CAMERA_STARBOARD , own_yaw_angle,      SHIP_MODEL, yaw_angle_rad]

      # Ship EKF
      - [SHIP_EKF, tau_u,               MACHINERY_SYSTEM, thrust_force]
      - [SHIP_EKF, tau_v,               RUDDER,           rudder_force_v]
      - [SHIP_EKF, tau_r,               RUDDER,           rudder_force_r]
      - [SHIP_EKF, measured_north,      GPS,              measured_north]
      - [SHIP_EKF, measured_east,       GPS,              measured_east]
      - [SHIP_EKF, gps_valid,           GPS,              measurement_valid]
      - [SHIP_EKF, measured_heading,    GYROCOMPASS,      measured_ship_heading_rad]
      - [SHIP_EKF, gyro_valid,          GYROCOMPASS,      measurement_valid]
      - [SHIP_EKF, measured_ship_speed, SPEED_LOG,        measured_ship_speed]
      - [SHIP_EKF, speed_log_valid,     SPEED_LOG,        measurement_valid]

      # Target Ship Tracking EKF
      - [TS_TRACKING_EKF_TS1, estimated_own_north,    SHIP_EKF, estimated_n]
      - [TS_TRACKING_EKF_TS1, estimated_own_east,     SHIP_EKF, estimated_e]
      - [TS_TRACKING_EKF_TS1, estimated_yaw_angle,    SHIP_EKF, estimated_psi]
      - [TS_TRACKING_EKF_TS1, estimated_speed_north,  SHIP_EKF, estimated_u]
      - [TS_TRACKING_EKF_TS1, estimated_speed_east,   SHIP_EKF, estimated_v]
      - [TS_TRACKING_EKF_TS1, radar_valid,            SHIP_EKF, measurement_valid]
      - [TS_TRACKING_EKF_TS1, camera_fore_valid,      SHIP_EKF, measurement_valid]
      - [TS_TRACKING_EKF_TS1, camera_aft_valid,       SHIP_EKF, measurement_valid]
      - [TS_TRACKING_EKF_TS1, camera_port_valid,      SHIP_EKF, measurement_valid]
      - [TS_TRACKING_EKF_TS1, camera_starboard_valid, SHIP_EKF, measurement_valid]


    SHIP_OBSERVERS:
      - [MISSION_MANAGER, prev_wp_north, "Waypoint [m]"]
      - [MISSION_MANAGER, prev_wp_east, "Waypoint [m]"]
      - [MISSION_MANAGER, prev_wp_speed, "Speed [m/s]"]
      - [MISSION_MANAGER, next_wp_north, "Waypoint [m]"]
      - [MISSION_MANAGER, next_wp_east, "Waypoint [m]"]
      - [MISSION_MANAGER, next_wp_speed, "Speed [m/s]"]

      - [AUTOPILOT, yaw_angle_ref_rad, "Angle [rad]"]
      - [AUTOPILOT, rudder_angle_deg, "Angle [deg]"]
      - [AUTOPILOT, e_ct, "Error [m]"]

      - [SHAFT_SPEED_CONTROLLER, shaft_speed_cmd_rpm, "Shaft Speed [rpm]"]

      - [THROTTLE_CONTROLLER, throttle_cmd, "Throttle [%]"]

      - [MACHINERY_SYSTEM, thrust_force, "Force [kN]"]
      - [MACHINERY_SYSTEM, shaft_speed_rpm, "Shaft Speed [rpm]"]
      - [MACHINERY_SYSTEM, cmd_load_fraction_me, "Load Fraction [%]"]
      - [MACHINERY_SYSTEM, cmd_load_fraction_hsg, "Load Fraction [%]"]
      - [MACHINERY_SYSTEM, power_me, "Power [kW]"]
      - [MACHINERY_SYSTEM, available_power_me, "Power [kW]"]
      - [MACHINERY_SYSTEM, power_electrical, "Power [kW]"]
      - [MACHINERY_SYSTEM, available_power_electrical, "Power [kW]"]
      - [MACHINERY_SYSTEM, power, "Power [kW]"]
      - [MACHINERY_SYSTEM, propulsion_power, "Power [kW]"]
      - [MACHINERY_SYSTEM, fuel_rate_me, "Fuel Rate [kg/s]"]
      - [MACHINERY_SYSTEM, fuel_rate_hsg, "Fuel Rate [kg/s]"]
      - [MACHINERY_SYSTEM, fuel_rate, "Fuel Rate [kg/s]"]
      - [MACHINERY_SYSTEM, fuel_consumption_me, "Fuel Mass [kg]"]
      - [MACHINERY_SYSTEM, fuel_consumption_hsg, "Fuel Mass [kg]"]
      - [MACHINERY_SYSTEM, fuel_consumption, "Fuel Mass [kg]"]
      - [MACHINERY_SYSTEM, motor_torque, "Torque [Nm]"]
      - [MACHINERY_SYSTEM, hybrid_shaft_generator_torque, "Torque [Nm]"]

      - [RUDDER, rudder_force_v, "Force [kN]"]
      - [RUDDER, rudder_force_r, "Moment [Nm]"]

      - [SHIP_MODEL, north, "Position [m]"]
      - [SHIP_MODEL, east, "Position [m]"]
      - [SHIP_MODEL, yaw_angle_rad, "Angle [rad]"]
      - [SHIP_MODEL, forward_speed, "Speed [m/s]"]
      - [SHIP_MODEL, sideways_speed, "Speed [m/s]"]
      - [SHIP_MODEL, yaw_rate, "Angular Speed [rad/s]"]
      - [SHIP_MODEL, total_ship_speed, "Speed [m/s]"]
      - [SHIP_MODEL, d_north, "Speed [m/s]"]
      - [SHIP_MODEL, d_east, "Speed [m/s]"]
      - [SHIP_MODEL, d_yaw_angle_rad, "Angular Speed [rad/s]"]
      - [SHIP_MODEL, d_forward_speed, "Acceleration [m/s2]"]
      - [SHIP_MODEL, d_sideways_speed, "Acceleration [m/s2]"]
      - [SHIP_MODEL, d_yaw_rate, "Angular Acc. [rad/s2]"]

      - [GPS, measured_north, "Position [m]"]
      - [GPS, measured_east, "Position [m]"]

      - [GYROCOMPASS, measured_ship_heading_rad, "Angle [rad]"]

      - [SPEED_LOG, measured_ship_speed, "Speed [m/s]"]

      - [SURFACE_CURRENT, current_speed, "Speed [m/s]"]
      - [SURFACE_CURRENT, current_direction_deg, "Angle [deg]"]

      - [SHIP_EKF, estimated_n,   "Position [m]"]
      - [SHIP_EKF, estimated_e,   "Position [m]"]
      - [SHIP_EKF, estimated_psi, "Angle [rad]"]
      - [SHIP_EKF, estimated_u,   "Speed [m/s]"]
      - [SHIP_EKF, estimated_v,   "Speed [m/s]"]
      - [SHIP_EKF, estimated_r,   "Angular Speed [rad/s]"]

      - [WIND, wind_speed, "Speed [m/s]"]
      - [WIND, wind_direction_deg, "Angle [deg]"]

    fmu_params:
      MISSION_MANAGER:
        ra: 300

      AUTOPILOT:
        r: 1000
        ki_ct: 0.002
        integrator_limit: 5000
        kp: 0.5
        ki: 0.00015
        kd: 50.0
        max_rudder_rate_deg_per_sec: 2.3
        max_rudder_angle_deg: 30

      SHAFT_SPEED_CONTROLLER:
        kp: 25.0
        ki: 0.5
        rated_speed_main_engine_rpm: 1000
        gear_ratio_between_main_engine_and_propeller: 0.6
        idle_rpm_fraction: 0.1

      THROTTLE_CONTROLLER:
        kp: 0.00005
        ki: 0.000075

      MACHINERY_SYSTEM:
        max_dt: 0.5
        hotel_load: 200000
        rated_speed_main_engine_rpm: 1000
        linear_friction_main_engine: 68
        linear_friction_hybrid_shaft_generator: 57
        gear_ratio_between_main_engine_and_propeller: 0.6
        gear_ratio_between_hybrid_shaft_generator_and_propeller: 0.6
        propeller_inertia: 6000
        propeller_speed_to_torque_coefficient: 7.5
        propeller_diameter: 3.1
        propeller_speed_to_thrust_force_coefficient: 1.7
        specific_fuel_consumption_coefficients_me_a_coeff: 128.89
        specific_fuel_consumption_coefficients_me_b_coeff: -168.93
        specific_fuel_consumption_coefficients_me_c_coeff: 246.76
        specific_fuel_consumption_coefficients_dg_a_coeff: 180.71
        specific_fuel_consumption_coefficients_dg_b_coeff: -289.90
        specific_fuel_consumption_coefficients_dg_c_coeff: 324.90
        omega: 0.0
        d_omega: 0.0
        main_engine_capacity_spec: 2160000.0
        diesel_gen_capacity_spec: 510000.0
        mso_mode: 0

      RUDDER:
        rudder_angle_to_sway_force_coefficient: 50000
        rudder_angle_to_yaw_force_coefficient: 500000
        max_rudder_angle_negative_deg: -30
        max_rudder_angle_positive_deg: 30

      COLAV:
        soft_heading_offset_deg: 30
        hard_heading_offset_deg: 45
        danger_zone_radius: 926.0
        collision_zone_radius: 100.0
        max_target_ship_count: 3
        hold_time: 900.0
        T_lookahead: 900.0
        own_ship_sog_max: 6.0
        turning_direction: "STARBOARD"

      SHIP_MODEL:
        dead_weight_tonnage: 3850000
        coefficient_of_deadweight_to_displacement: 0.7
        bunkers: 200000
        ballast: 200000
        length_of_ship: 80
        width_of_ship: 16
        added_mass_coefficient_in_surge: 0.4
        added_mass_coefficient_in_sway: 0.4
        added_mass_coefficient_in_yaw: 0.4
        mass_over_linear_friction_coefficient_in_surge: 130
        mass_over_linear_friction_coefficient_in_sway: 18
        mass_over_linear_friction_coefficient_in_yaw: 90
        nonlinear_friction_coefficient_in_surge: 2400
        nonlinear_friction_coefficient_in_sway: 4000
        nonlinear_friction_coefficient_in_yaw: 400
        rho_seawater: 1025
        rho_air: 1.2
        front_above_water_height: 8
        side_above_water_height: 8
        cx: 0.5
        cy: 0.7
        cn: 0.08
        initial_forward_speed_m_per_s: 0.0
        initial_sideways_speed_m_per_s: 0.0
        initial_yaw_rate_rad_per_s: 0.0

      GPS:
        seed: 42
        north_sigma: 2.0
        east_sigma: 2.0
        
      GYROCOMPASS:
        seed: 42
        ship_heading_sigma_deg: 0.05 

      SPEED_LOG:
        seed: 42
        ship_speed_sigma: 0.05

      RADAR:
        seed: 42
        max_target_ship_count: 3
        range_sigma: 10.0
        range_rate_sigma: 0.2
        bearing_sigma_deg: 1.0
        max_range: 45000

      CAMERA_FORE:
        seed: 42
        max_target_ship_count: 3
        length_of_ship: 80
        width_of_ship: 16
        range_sigma: 50.0
        bearing_sigma_deg: 0.1
        camera_position: "fore"
        camera_far_depth_of_field_limit: 2000
        camera_horizontal_fov_angle_limit_deg: 120
      
      CAMERA_AFT:
        seed: 42
        max_target_ship_count: 3
        length_of_ship: 80
        width_of_ship: 16
        range_sigma: 50.0
        bearing_sigma_deg: 0.1
        camera_position: "aft"
        camera_far_depth_of_field_limit: 2000
        camera_horizontal_fov_angle_limit_deg: 120
      
      CAMERA_PORT:
        seed: 42
        max_target_ship_count: 3
        length_of_ship: 80
        width_of_ship: 16
        range_sigma: 50.0
        bearing_sigma_deg: 0.1
        camera_position: "port"
        camera_far_depth_of_field_limit: 2000
        camera_horizontal_fov_angle_limit_deg: 120
      
      CAMERA_STARBOARD:
        seed: 42
        max_target_ship_count: 3
        length_of_ship: 80
        width_of_ship: 16
        range_sigma: 50.0
        bearing_sigma_deg: 0.1
        camera_position: "starboard"
        camera_far_depth_of_field_limit: 2000
        camera_horizontal_fov_angle_limit_deg: 120

      SHIP_EKF:
        max_dt: 0.5
        dead_weight_tonnage: 3850000
        coefficient_of_deadweight_to_displacement: 0.7
        bunkers: 200000
        ballast: 200000
        length_of_ship: 80
        width_of_ship: 16
        added_mass_coefficient_in_surge: 0.4
        added_mass_coefficient_in_sway: 0.4
        added_mass_coefficient_in_yaw: 0.4
        mass_over_linear_friction_coefficient_in_surge: 130
        mass_over_linear_friction_coefficient_in_sway: 18
        mass_over_linear_friction_coefficient_in_yaw: 90
        nonlinear_friction_coefficient_in_surge: 2400
        nonlinear_friction_coefficient_in_sway: 4000
        nonlinear_friction_coefficient_in_yaw: 400
        rho_seawater: 1025
        sigma_p0_n: 2.0
        sigma_p0_e: 2.0
        sigma_p0_psi: 0.05
        sigma_p0_u: 0.05
        sigma_p0_v: 0.05
        sigma_p0_r: 0.05
        sigma_gps_north: 2.0
        sigma_gps_east: 2.0
        sigma_gyro: 0.05
        sigma_speed_log: 0.05
        sigma_q_n: 2.0
        sigma_q_e: 2.0
        sigma_q_psi: 0.05
        sigma_q_u: 0.05
        sigma_q_v: 0.05
        sigma_q_r: 0.05
      
      TS_TRACKING_EKF_TS1:
        max_dt: 5.0
        length_of_ship: 80
        width_of_ship: 16
        sigma_acc_north: 0.2
        sigma_acc_east: 0.2
        sigma_p0_n: 10.0
        sigma_p0_e: 10.0
        sigma_p0_vn: 0.2
        sigma_p0_ve: 0.2
        sigma_radar_range: 10.0
        sigma_radar_range_rate: 0.2
        sigma_radar_bearing_deg: 1.0
        sigma_fore_camera_range: 50.0
        sigma_fore_camera_bearing_deg: 0.1
        sigma_aft_camera_range: 50.0
        sigma_aft_camera_bearing_deg: 0.1
        sigma_port_camera_range: 50.0
        sigma_port_camera_bearing_deg: 0.1
        sigma_starboard_camera_range: 50.0
        sigma_starboard_camera_bearing_deg: 0.1

      SURFACE_CURRENT:
        seed: 0
        initial_current_speed: 0.01
        current_speed_decay_rate: 0.5
        current_speed_standard_deviation: 0.15
        initial_current_direction_deg: 0.0
        current_direction_deg_decay_rate: 0.5 
        current_direction_deg_standard_deviation: 5.0
        clip_speed_nonnegative: True
        fail_outputs_zero: True

      WIND:
        seed: 0
        initial_mean_wind_speed: 5.0
        mean_wind_speed_decay_rate: 0.5
        mean_wind_speed_standard_deviation: 1.5
        initial_wind_direction_deg: 0.0
        wind_direction_deg_decay_rate: 0.5
        wind_direction_deg_standard_deviation: 5.0
        minimum_mean_wind_speed: 0.0
        maximum_mean_wind_speed: 42.0
        minimum_wind_gust_frequency: 0.06
        maximum_wind_gust_frequency: 0.4
        wind_gust_frequency_discrete_unit_count: 100
        wind_evaluation_height: 5.0
        U10: 10.0
        kappa_parameter: 0.0026
        clip_speed_nonnegative: True
        manual_mean_wind_speed: True
        fail_outputs_zero: True

##########################################################

  - id: TS1

    spawn:
      start_time: 250.0
      north: 10000.0
      east: 0.0
      yaw_angle_deg: 135.0
      forward_speed: 0.0

    route:
      north: [10000.0 , 0.0     ]
      east:  [0.0     , 10000.0 ]
      speed: 5.0          # Upon reaching the next waypoint

    SHIP_BLOCKS:
      - [MISSION_MANAGER, FMUs/simplified_ship/MissionManager.fmu]
      - [AUTOPILOT, FMUs/simplified_ship/Autopilot.fmu]
      - [SPEED_CONTROLLER, FMUs/simplified_ship/SpeedController.fmu]
      - [RUDDER, FMUs/simplified_ship/Rudder.fmu]
      - [SHIP_MODEL, FMUs/simplified_ship/ShipModel.fmu]
      - [SURFACE_CURRENT, FMUs/env_loads/SurfaceCurrentModel.fmu]
      - [WIND, FMUs/env_loads/WindModel.fmu]

    SHIP_CONNECTIONS:
      # Mission manager
      - [MISSION_MANAGER, north, SHIP_MODEL, north]
      - [MISSION_MANAGER, east,  SHIP_MODEL, east]

      # Autopilot
      - [AUTOPILOT, north,         SHIP_MODEL,      north]
      - [AUTOPILOT, east,          SHIP_MODEL,      east]
      - [AUTOPILOT, yaw_angle_rad, SHIP_MODEL,      yaw_angle_rad]
      - [AUTOPILOT, prev_wp_north, MISSION_MANAGER, prev_wp_north]
      - [AUTOPILOT, prev_wp_east,  MISSION_MANAGER, prev_wp_east]
      - [AUTOPILOT, next_wp_north, MISSION_MANAGER, next_wp_north]
      - [AUTOPILOT, next_wp_east,  MISSION_MANAGER, next_wp_east]

      # Speed controller
      - [SPEED_CONTROLLER, desired_ship_speed,  MISSION_MANAGER,  next_wp_speed]
      - [SPEED_CONTROLLER, measured_ship_speed, SHIP_MODEL,       forward_speed]

      # Rudder
      - [RUDDER, rudder_angle_deg, AUTOPILOT,  rudder_angle_deg]
      - [RUDDER, yaw_angle_rad,    SHIP_MODEL, yaw_angle_rad]
      - [RUDDER, forward_speed,    SHIP_MODEL, forward_speed]

      # Ship model
      - [SHIP_MODEL, thrust_force,     SPEED_CONTROLLER, thrust_force]
      - [SHIP_MODEL, rudder_force_v,   RUDDER,           rudder_force_v]
      - [SHIP_MODEL, rudder_force_r,   RUDDER,           rudder_force_r]
      - [SHIP_MODEL, current_speed ,   SURFACE_CURRENT,  current_speed]
