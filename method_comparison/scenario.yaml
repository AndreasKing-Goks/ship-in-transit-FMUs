# DRAFT
#
# Scenario and search space shared by all test groups.
# Values come from the current AST setup on main. Units are in [brackets].

# Ship models, own-ship tuning (autopilot, COLAV), wind and current.
simulation_config: EBASTv2_train/EBASTv2_train_2.yaml

# ---------------------------------------------------------------------------
# Search space: what is drawn for each case
# Source: orchestrator/scenario_config.py:441-582, EBASTv2_train/encounter_settings.json
# ---------------------------------------------------------------------------
n_target_ships: 2

# One type drawn uniformly per target ship
encounter_types: [head-on, overtaking-give-way, overtaking-stand-on, crossing-give-way, crossing-stand-on]

# Relative bearing of the target ship [deg], uniform within the bounds
beta_bounds:
  head-on: [-3.0, 3.0]
  overtaking-give-way: [-65.5, 65.5]
  overtaking-stand-on: [[114.5, 178.0], [-178.0, -114.5]]   # one of the two, 50/50
  crossing-give-way: [7.0, 110.5]
  crossing-stand-on: [-110.5, -7.0]

# Target ship SOG / own ship SOG [-], uniform within the bounds
relative_speed_bounds:
  head-on: [0.5, 1.5]
  overtaking-give-way: [0.25, 0.75]
  overtaking-stand-on: [1.5, 2.0]
  crossing-give-way: [0.5, 1.5]
  crossing-stand-on: [0.5, 1.5]

vector_time_bounds: [40, 80]          # [min] whole minutes, uniform

own_ship_sog_bounds: [5.0, 6.0]       # [m/s] uniform
own_ship_heading_step: 15.0           # [deg] heading drawn from 0, 15, ..., 345
own_ship_start: [0.0, 0.0]            # [m] north, east
target_ship_sog_max: 8.0              # [m/s] target ship speed is capped here

# ---------------------------------------------------------------------------
# Traffic generator (trafficgen 0.9.0)
# Source: EBASTv2_train/encounter_settings.json
# ---------------------------------------------------------------------------
traffic_generator:
  theta13Criteria: 67.5               # [deg] encounter classification thresholds
  theta14Criteria: 5.0                # [deg]
  theta15Criteria: 5.0                # [deg]
  theta15: [112.5, 247.5]             # [deg]
  situationLength: 90.0               # [min]
  maxMeetingDistance: 5.0             # [NM]
  situationDevelopTime: 60.0          # [min]

# ---------------------------------------------------------------------------
# Run
# Source: EBASTv2_train/EBASTv2_train_2.yaml:3-4
# ---------------------------------------------------------------------------
stop_time: 10000                      # [s]
step_size: 5.0                        # [s]

# One seed scheme for all methods, not agreed yet
seed: UNKNOWN
